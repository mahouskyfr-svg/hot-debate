function stripHtml(h){
  var d=document.createElement("div");
  d.innerHTML=h||"";
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
}

function isMostlyEnglish(str){
  if(!str)return false;
  var letters=(str.match(/[A-Za-z]/g)||[]).length;
  var cjk=(str.match(/[\u4e00-\u9fff]/g)||[]).length;
  return letters>12 && letters>cjk*2;
}

function translateToZh(text){
  var clean=String(text||"").trim();
  if(!clean)return Promise.resolve("");
  if(transCache[clean])return Promise.resolve(transCache[clean]);
  var slice=clean.slice(0,450);
  var url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(slice)+"&langpair=en|zh-CN";
  return fetch(url).then(function(r){return r.json()}).then(function(res){
    var out=(res&&res.responseData&&res.responseData.translatedText)||"";
    if(out && out.toLowerCase().indexOf("query length limit")===-1){
      transCache[clean]=out;
      return out;
    }
    return "";
  }).catch(function(){return ""});
}

function parseYouTubeId(u){
  if(!u)return "";
  var m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m?m[1]:"";
}

function extractRealMedia(it,rawHtml){
  var img="";
  if(it.thumbnail&&String(it.thumbnail).indexOf("http")===0)img=it.thumbnail;
  if(!img&&it.enclosure&&it.enclosure.link&&/\.(jpg|jpeg|png|webp|gif)/i.test(it.enclosure.link))img=it.enclosure.link;
  if(!img&&rawHtml){
    var mImg=String(rawHtml).match(/<img[^>]+src=["']([^"']+)["']/i);
    if(mImg&&mImg[1]&&mImg[1].indexOf("http")===0)img=mImg[1];
  }
  var mp4="";
  if(it.enclosure&&it.enclosure.link&&/\.(mp4|webm|m3u8)/i.test(it.enclosure.link))mp4=it.enclosure.link;
  if(!mp4&&rawHtml){
    var mVid=String(rawHtml).match(/<(?:video|source)[^>]+src=["']([^"']+\.(?:mp4|webm|m3u8)[^"']*)["']/i);
    if(mVid&&mVid[1])mp4=mVid[1];
  }
  var ytId=parseYouTubeId(it.link||"")||parseYouTubeId(rawHtml||"");
  return {img:img,mp4:mp4,ytId:ytId,hasRealVideo:Boolean(mp4||ytId)};
}

function parseAge(pubStr){
  if(!pubStr)return {hours:12,label:"近期",ts:Date.now()-43200000};
  var ts=Date.parse(pubStr);
  if(isNaN(ts))return {hours:18,label:String(pubStr).slice(0,16),ts:Date.now()-64800000};
  var h=Math.max(1,Math.round((Date.now()-ts)/3600000));
  var lbl=h<=48?(h+"小时前"):(Math.ceil(h/24)+"天前");
  return {hours:h,label:lbl,ts:ts};
}

// 尝试拉取原文正文段落（受部分网站跨域限制时自动保留抓取到的完整段落）
function tryFetchArticleBody(articleUrl,fallbackText){
  if(!articleUrl||articleUrl.indexOf("http")!==0)return Promise.resolve(fallbackText);
  var proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(articleUrl);
  return fetch(proxy).then(function(r){return r.text()}).then(function(html){
    if(!html||html.length<200)return fallbackText;
    var doc=new DOMParser().parseFromString(html,"text/html");
    var ps=doc.querySelectorAll("article p, main p, p");
    var lines=[];
    for(var i=0;i<ps.length&&lines.length<8;i++){
      var t=(ps[i].textContent||"").replace(/\s+/g," ").trim();
      if(t.length>=35&&lines.indexOf(t)===-1)lines.push(t);
    }
    if(lines.length>=2)return lines.join("\n\n");
    return fallbackText;
  }).catch(function(){return fallbackText});
}

function fetchFeedSource(fc,bankOffset){
  var api="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(fc.rss);
  return fetch(api).then(function(r){return r.json()}).then(function(res){
    var arr=(res&&res.items)||[],out=[];
    for(var i=0;i<arr.length;i++){
      var raw=arr[i];
      var title=stripHtml(raw.title||"");
      if(!title)continue;
      var age=parseAge(raw.pubDate);
      if(age.hours>720)continue;
      var rawHtml=(raw.content||raw.description||"");
      var desc=stripHtml(rawHtml);
      if(!desc||desc.toLowerCase().indexOf("comments")===0){
        desc="信源 "+fc.name+" 条目链接已附带，点开后可尝试抓取正文或跳外部链接。";
      }
      var media=extractRealMedia(raw,rawHtml);
      var bIdx=(bankOffset+i)%IMG_BANK.length;
      var finalImg=media.img||IMG_BANK[bIdx];
      var imgOrigin=media.img?"信源原图":("图库 #"+String(bIdx+1).padStart(2,"0"));
      var pubLabel=raw.pubDate||age.label;

      out.push({
        id:fc.name+"_"+i+"_"+encodeURIComponent(title.slice(0,12)),
        cat:fc.cat,src:fc.name,url:raw.link||"",pubRaw:pubLabel,
        ageTag:age.hours<=48?"近48小时":"近30天",ageLabel:age.label,ageHours:age.hours,ts:age.ts,
        heatScore:Math.max(45,Math.round((95-age.hours*0.12-(i*0.8))*10)/10),
        img:finalImg,imgOrigin:imgOrigin,
        mp4:media.mp4,ytId:media.ytId,hasRealVideo:media.hasRealVideo,
        title:title,enTitle:isMostlyEnglish(title)?title:"",zhTitle:"",
        brief:desc,fullReport:desc,zhReport:"",
        d:[
          ["关注视角","展现了相关领域或地区的最新动态。"],
          ["审慎视角","单条信息信息量有限，后续进展仍需结合更多报道观察。"],
          ["思考视角","对照自身关注点与实际场景，判断它对你是否有参考价值。"]
        ]
      });
    }
    return out;
  }).catch(function(){return []});
}

function batchTranslateTitles(list){
  var targets=list.filter(function(x){return isMostlyEnglish(x.title)&&!x.zhTitle;}).slice(0,18);
  targets.forEach(function(item){
    translateToZh(item.title).then(function(zh){
      if(zh){
        item.zhTitle=zh;
        renderFeed();
      }
    });
  });
}

        visibleCount=PAGE_SIZE;
        renderFeed();
        batchTranslateTitles(liveMerged);
        bar.innerText="共 "+items.length+" 条（含知乎/小红书/TikTok/抖音风向 "+LIFE_AND_COMMUNITY_SEED.length+" 条 + 联网 "+liveMerged.length+" 条："+(okList.join(" · ")||"离线兜底")+"）";
      }
    });
  });
}

function sortList(arr){
  return arr.slice().sort(function(a,b){
    if(sortMode==="heat")return (b.heatScore||0)-(a.heatScore||0);
    return (b.ts||0)-(a.ts||0);
  });
}

function toggleSort(){
  sortMode=sortMode==="time"?"heat":"time";
  document.getElementById("sortBtn").innerText=sortMode==="time"?"最新↓":"热度↓";
  resetPageAndRender();
}

function chooseCat(c,el){

  if(el)el.className="tab active";
  resetPageAndRender();

function chooseTime(tm,el){

function resetPageAndRender(){
  visibleCount=PAGE_SIZE;

function loadNextPage(){
  if(visibleCount>=filtered.length)return;
  visibleCount=Math.min(filtered.length,visibleCount+PAGE_SIZE);
  renderFeed();
}

function toggleCardLike(e,id){
  e.stopPropagation();
  likedMap[id]=!likedMap[id];
  saveLikesStore();
  renderFeed();
}

function renderFeed(){
  var kw=(document.getElementById("searchBox").value||"").toLowerCase().trim();
  var m=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var okCat=(activeCat==="全部"||it.cat===activeCat);
    var okTime=true;
    if(activeTime==="站内可播视频")okTime=!!it.hasRealVideo;
    else if(activeTime!=="全部")okTime=(it.ageTag===activeTime);
    var okKw=(!kw||it.title.toLowerCase().indexOf(kw)>-1||(it.zhTitle||"").toLowerCase().indexOf(kw)>-1||(it.fullReport||it.brief).toLowerCase().indexOf(kw)>-1||it.src.toLowerCase().indexOf(kw)>-1);
    if(okCat&&okTime&&okKw)m.push(it);
  }
  filtered=sortList(m);
  var slice=filtered.slice(0,visibleCount);
  var html="";
  for(var j=0;j<slice.length;j++){
    var x=slice[j];
    var liked=!!likedMap[x.id];
    var likeCnt=liked?1:0;
    var vidBadge=x.hasRealVideo?'<span class="video-pill">▶ 站内可播</span>':"";
    var mainTitle=x.zhTitle||x.title;
    var subEn=(x.zhTitle&&x.enTitle)?('<div class="xhs-en">'+x.enTitle+'</div>'):"";
    html+='<div class="xhs-card" onclick="openDetail('+j+')">'+
      '<div class="media-wrap">'+
        '<img src="'+x.img+'" loading="lazy" alt="封面" onerror="this.style.display=\'none\'" />'+
        '<span class="media-badge">'+x.cat+' · '+x.ageLabel+'</span>'+
        vidBadge+
      '</div>'+
      '<div class="xhs-body">'+
        '<div class="xhs-title">'+mainTitle+'</div>'+
        subEn+
        '<div class="xhs-sub">'+x.brief+'</div>'+
        '<div class="xhs-meta">'+
          '<span class="src-label">'+x.src+'</span>'+
          '<span class="like-btn'+(liked?' liked':'')+'" onclick="toggleCardLike(event,\''+x.id+'\')">'+(liked?'♥':'♡')+' '+likeCnt+'</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  document.getElementById("feedGrid").innerHTML=html||'<div class="panel">当前筛选下没有匹配条目。</div>';

  var txtEl=document.getElementById("loadMoreTxt");
  var btnEl=document.getElementById("loadMoreBtn");
  if(filtered.length===0){
    txtEl.innerText="";
    btnEl.style.display="none";
  }else if(slice.length<filtered.length){
    txtEl.innerText="已显示 "+slice.length+" / "+filtered.length+" 条 · 下滑自动加载下一批";
    btnEl.style.display="inline-block";
  }else{
    txtEl.innerText="已显示全部 "+filtered.length+" 条内容";
    btnEl.style.display="none";
  }
}

window.addEventListener("scroll",function(){
  if(document.getElementById("feedView").style.display==="none")return;
  if(document.getElementById("detailModal").className.indexOf("open")>-1)return;
  var sy=window.scrollY||window.pageYOffset||0;
  var wh=window.innerHeight||document.documentElement.clientHeight||0;
  var dh=document.documentElement.scrollHeight||0;
  if(sy+wh>=dh-260)loadNextPage();
});

function translateCurrentItem(){
  if(!currentItem)return;
  var x=currentItem;
  var biBox=document.getElementById("dBilingualBox");
  biBox.style.display="block";
  biBox.innerText="正在翻译为中英双语对照...";
  Promise.all([
    x.zhTitle?Promise.resolve(x.zhTitle):translateToZh(x.title),
    x.zhReport?Promise.resolve(x.zhReport):translateToZh(x.fullReport||x.brief)
  ]).then(function(res){
    var zt=res[0]||x.title;
    var zr=res[1]||(x.fullReport||x.brief);
    x.zhTitle=zt;
    x.zhReport=zr;
    document.getElementById("dTitle").innerText=zt;
    if(x.enTitle){
      var enEl=document.getElementById("dEnTitle");
      enEl.innerText="原文标题："+x.enTitle;
      enEl.style.display="block";
    }
    biBox.innerText="【中文译文】\n"+zr+"\n\n【原文对照】\n"+(x.fullReport||x.brief);
    renderFeed();
  });
}

function openDetail(idx){
  var x=filtered[idx];
  if(!x)return;
  currentItem=x;

  var slot=document.getElementById("dMediaSlot");
  if(x.mp4){
    slot.innerHTML='<video controls playsinline preload="metadata" poster="'+x.img+'"><source src="'+x.mp4+'" /></video>';
    document.getElementById("dMediaKind").innerText="站内视频播放器（可直接点播）";
  }else if(x.ytId){
    slot.innerHTML='<iframe src="https://www.youtube.com/embed/'+x.ytId+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    document.getElementById("dMediaKind").innerText="站内视频内嵌播放";
  }else{
    slot.innerHTML='<img src="'+x.img+'" alt="报道配图" onerror="this.style.display=\'none\'" />';
    document.getElementById("dMediaKind").innerText="图文条目（该条源未提供直连视频流）";
  }
  document.getElementById("dImgSrc").innerText="配图："+x.imgOrigin;

  var linkEl=document.getElementById("dOriginLink");
  if(x.url){linkEl.href=x.url;linkEl.style.display="inline-flex";}
  else{linkEl.style.display="none";}

  document.getElementById("dTitle").innerText=x.zhTitle||x.title;
  var enEl=document.getElementById("dEnTitle");
  if(x.enTitle){
    enEl.innerText="原文标题："+x.enTitle;
    enEl.style.display="block";
  }else{
    enEl.style.display="none";
  }

  document.getElementById("dSrcLine").innerText="出处："+x.src+"（"+x.cat+"）";
  document.getElementById("dTimeLine").innerText="时间："+x.pubRaw;
  document.getElementById("dFullReport").innerText=x.fullReport||x.brief;
  document.getElementById("dBilingualBox").style.display="none";

  document.getElementById("dL1").innerText=x.d[0][0];document.getElementById("dT1").innerText=x.d[0][1];
  document.getElementById("dL2").innerText=x.d[1][0];document.getElementById("dT2").innerText=x.d[1][1];
  document.getElementById("dL3").innerText=x.d[2][0];document.getElementById("dT3").innerText=x.d[2][1];

  document.getElementById("noteInput").value="";

  if(x.url && (!x.fullReport || x.fullReport.length < 180)){
    tryFetchArticleBody(x.url,x.fullReport||x.brief).then(function(bodyTxt){
      if(currentItem && currentItem.id===x.id && bodyTxt){
        x.fullReport=bodyTxt;
        document.getElementById("dFullReport").innerText=bodyTxt;
      }
    });
  }
  if(isMostlyEnglish(x.title)){
    translateCurrentItem();
  }
}

function saveNote(){

  if(!notesStore[currentItem.id])notesStore[currentItem.id]=[];
  notesStore[currentItem.id].unshift({topicTitle:currentItem.zhTitle||currentItem.title,text:txt,time:new Date().toLocaleString("zh-CN")});
  saveNotesStore();
  document.getElementById("noteInput").value="";
  renderTopicNotes(currentItem.id);
}

function switchTab(t){
  document.getElementById("feedView").style.display=t==="feed"?"block":"none";
  document.getElementById("vaultView").style.display=t==="vault"?"block":"none";
  document.getElementById("navFeed").className="nav-btn"+(t==="feed"?" on":"");
  document.getElementById("navVault").className="nav-btn"+(t==="vault"?" on":"");

function renderVault(){
  var all=[];
  for(var k in notesStore)if(Object.prototype.hasOwnProperty.call(notesStore,k)){
    var l=notesStore[k]||[];for(var i=0;i<l.length;i++)all.push(l[i]);
  }
  document.getElementById("vaultCount").innerText="已记录 "+all.length+" 条";
  if(!all.length){document.getElementById("vaultList").innerHTML='<div class="panel"><div class="sub">还没有随想笔记，点开任意一条内容写下看法即可保存。</div></div>';return}
  var html="";
  for(var j=0;j<all.length;j++)html+='<div class="panel"><div style="font-size:11px;color:#ff2442;margin-bottom:4px">'+all[j].topicTitle+'</div><div style="font-size:13px">'+all[j].text+'</div><div class="sub">'+all[j].time+'</div></div>';
  document.getElementById("vaultList").innerHTML=html;
}

function clearAllNotes(){notesStore={};saveNotesStore();renderVault()}

refreshAll();
