  fullReport:"【事件背景】随着折叠屏手机形态在日常通勤、差旅和居家场景中高频出现，不少用户发现当页面或应用运行在较窄的外屏视口、分屏窗口或特定缩放比例下时，屏幕右侧或边缘常出现一块“什么都点不动、也没有内容”的空白区，或者正文被挤压成细长条。\n\n【成因拆解】一方面，部分移动端页面和组件在编写样式时依赖固定像素宽度或绝对定位的侧边/顶部栏位，当实际视口宽度发生变化时，容器无法顺滑重排；另一方面，部分浏览器或系统级适配策略在面对未声明响应式断点的页面时，会保留默认留白或触发局部缩放错位。\n\n【核心争议】用户普遍希望在有限的屏幕面积里获得更充分、更顺手的有效信息与操作空间，而部分系统或界面设计则强调留出边界以防边缘误触和手势冲突。两者之间的平衡点，决定了窄屏体验究竟是“清爽顺手”还是“憋屈浪费”。",

function stripHtml(h){
  var d=document.createElement("div");
  d.innerHTML=h||"";
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
}

function parseYouTubeId(u){
  if(!u)return "";
  var m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
  return m?m[1]:"";
}

function extractRealMedia(it,rawHtml){
  var img="";
  if(it.thumbnail&&String(it.thumbnail).indexOf("http")===0)img=it.thumbnail;
  if(!img&&it.enclosure&&it.enclosure.link&&/\.(jpg|jpeg|png|webp|gif)/i.test(it.enclosure.link))img=it.enclosure.link;
  if(!img&&rawHtml){
    var mImg=String(rawHtml).match(/<img[^>]+src=["']([^"']+)["']/i);
    if(mImg&&mImg[1]&&mImg[1].indexOf("http")===0)img=mImg[1];
  }
  var mp4="";
  if(it.enclosure&&it.enclosure.link&&/\.(mp4|webm|m3u8)/i.test(it.enclosure.link))mp4=it.enclosure.link;
  if(!mp4&&rawHtml){
    var mVid=String(rawHtml).match(/<source[^>]+src=["']([^"']+\.(?:mp4|webm|m3u8)[^"']*)["']/i);
    if(mVid&&mVid[1])mp4=mVid[1];
  }
  var ytId=parseYouTubeId(it.link||"")||parseYouTubeId(rawHtml||"");
  return {img:img,mp4:mp4,ytId:ytId,hasRealVideo:Boolean(mp4||ytId)};
}

function parseAge(pubStr){
  if(!pubStr)return {hours:12,label:"近期"};
  var ts=Date.parse(pubStr);
  if(isNaN(ts))return {hours:18,label:String(pubStr).slice(0,16)};
  var h=Math.max(1,Math.round((Date.now()-ts)/3600000));
  var lbl=h<=48?(h+"小时前"):(Math.ceil(h/24)+"天前");
  return {hours:h,label:lbl,ts:ts};
}

function composeDetailedReport(title,srcName,pubLabel,desc,url,age){
  var p1="【报道概览】本条内容来自「"+srcName+"」发布（"+pubLabel+"），报道主题为「"+title+"」。";
  var p2="【核心内容说明】"+desc;
  var p3="【背景与阅读提示】该动态属于"+(age.hours<=48?"近 48 小时内":"近 30 天内")+"的关注焦点。若需查看完整图文排版、补充数据或原始上下文，可通过详情页顶部的「阅读原文 ↗」直达信源页面核对。";
  return p1+"\n\n"+p2+"\n\n"+p3;
}

function fetchFeedSource(fc,bankOffset){
  var api="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(fc.rss);
  return fetch(api).then(function(r){return r.json()}).then(function(res){
    var arr=(res&&res.items)||[],out=[];
    for(var i=0;i<arr.length;i++){
      var raw=arr[i];
      var title=stripHtml(raw.title||"");
      if(!title)continue;
      var age=parseAge(raw.pubDate);
      if(age.hours>720)continue;
      var rawHtml=(raw.content||raw.description||"");
      var desc=stripHtml(rawHtml);
      if(!desc||desc.toLowerCase().indexOf("comments")===0){
        desc="信源 "+fc.name+" 提供了该条目的原始链接，报道正文细节请点击详情页右上角「阅读原文 ↗」查看完整页面。";
      }
      var media=extractRealMedia(raw,rawHtml);
      var picObj=IMG_BANK_120[(bankOffset+i)%IMG_BANK_120.length];
      var finalImg=media.img||picObj.url;
      var imgOrigin=media.img?"信源原图":("独立图库 "+picObj.code);
      var pubLabel=raw.pubDate||age.label;
      var fullRep=composeDetailedReport(title,fc.name,pubLabel,desc,raw.link||"",age);
      var hnPoints=0;
      var pm=title.match(/\((\d+)\s*points?\)/i);
      if(pm)hnPoints=parseInt(pm[1],10);
      var heat=hnPoints>0?(50+Math.min(49,hnPoints/10)):Math.max(40,Math.round((96-age.hours*0.12-(i*0.8))*10)/10);

      out.push({
        id:fc.name+"_"+i+"_"+encodeURIComponent(title.slice(0,14)),
        cat:fc.cat,
        src:fc.name,
        url:raw.link||"",
        pubRaw:pubLabel,
        ageTag:age.hours<=48?"近48小时":"近30天",
        ageLabel:age.label,
        ageHours:age.hours,
        ts:age.ts||Date.now()-age.hours*3600000,
        heatScore:heat,
        img:finalImg,
        imgOrigin:imgOrigin,
        mp4:media.mp4,
        ytId:media.ytId,
        hasRealVideo:media.hasRealVideo,
        title:title,
        brief:desc,
        fullReport:fullRep,
        longAns:"【详实梳理】\n围绕「"+title+"」，目前公开报道主要集中在事件进展、各方态度与后续影响三个层面。\n\n建议结合信源「"+fc.name+"」的原文内容，对照你日常关心的领域或使用习惯，独立判断它的实际意义，再在下方写下随想或用反方三点质询检验自己的看法。",
        d:[
          ["推进与关注视角","该报道呈现了相关领域或地区的最新动态，有助于及时掌握变化脉络。"],
          ["审慎与核实视角","单篇快讯或摘要往往只覆盖局部信息，后续进展与细节仍需结合更多报道观察。"],
          ["深入拆解视角","关注事件背后的真实原因与长期影响，比单纯停留在标题情绪上更有价值。"]
        ]
      });
    }
    return out;
  }).catch(function(){return []});
}

function sortList(arr){

    if(sortMode==="heat")return (b.heatScore||0)-(a.heatScore||0);
    return (b.ts||0)-(a.ts||0);
  });
}

  if(filtered.length===0){
    txtEl.innerText="";
    btnEl.style.display="none";
  }else if(slice.length<filtered.length){
    txtEl.innerText="已显示 "+slice.length+" / "+filtered.length+" 条 · 下滑自动加载下一批";
    btnEl.style.display="inline-block";
  }else{
    txtEl.innerText="已显示全部 "+filtered.length+" 条内容";
    btnEl.style.display="none";
  }
}

window.addEventListener("scroll",function(){
  if(document.getElementById("feedView").style.display==="none")return;
  if(document.getElementById("detailModal").className.indexOf("open")>-1)return;
  var sy=window.scrollY||window.pageYOffset||0;
  var wh=window.innerHeight||document.documentElement.clientHeight||0;
  var dh=document.documentElement.scrollHeight||0;
  if(sy+wh>=dh-260)loadNextPage();
});

function toggleAgree(){
  if(!currentItem)return;
  agreedMap[currentItem.id]=!agreedMap[currentItem.id];
  saveSocialStore();
  updateAgreeUI(currentItem);
}

function updateAgreeUI(x){
  var on=!!agreedMap[x.id];
  document.getElementById("dAgreeBtn").className="agree-pill"+(on?" on":"");
  document.getElementById("dAgreeNum").innerText=on?"1":"0";
}

function openDetail(idx){
  var x=filtered[idx];
  if(!x)return;
  currentItem=x;

  var slot=document.getElementById("dMediaSlot");
  if(x.mp4){
    slot.innerHTML='<video controls playsinline preload="metadata" poster="'+x.img+'"><source src="'+x.mp4+'" /></video>';
    document.getElementById("dMediaKind").innerText="真实视频流播放器";
  }else if(x.ytId){
    slot.innerHTML='<iframe src="https://www.youtube.com/embed/'+x.ytId+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    document.getElementById("dMediaKind").innerText="YouTube 真实视频嵌入";
  }else{
    slot.innerHTML='<img src="'+x.img+'" alt="报道配图" onerror="this.style.display=\'none\'" />';
    document.getElementById("dMediaKind").innerText="图文报道";
  }
  document.getElementById("dImgSrc").innerText="配图出处："+x.imgOrigin;

  var linkEl=document.getElementById("dOriginLink");
  if(x.url){linkEl.href=x.url;linkEl.style.display="inline-flex";}
  else{linkEl.style.display="none";}

  document.getElementById("dTitle").innerText=x.title;
  document.getElementById("dSrcLine").innerText="出处："+x.src+"（"+x.cat+"）";
  document.getElementById("dTimeLine").innerText="时间："+x.pubRaw+(x.url?(" · 原文："+x.url):"");
  document.getElementById("dFullReport").innerText=x.fullReport||x.brief;
  document.getElementById("dL1").innerText=x.d[0][0];document.getElementById("dT1").innerText=x.d[0][1];
  document.getElementById("dL2").innerText=x.d[1][0];document.getElementById("dT2").innerText=x.d[1][1];
  document.getElementById("dL3").innerText=x.d[2][0];document.getElementById("dT3").innerText=x.d[2][1];
  document.getElementById("dLongAns").innerText=x.longAns;
  updateAgreeUI(x);

  document.getElementById("noteInput").value="";
  document.getElementById("copyTip").innerText="";
  document.getElementById("rebutPanel").style.display="none";
  renderTopicNotes(x.id);
  document.getElementById("detailModal").className="modal open";
  document.getElementById("detailModal").scrollTop=0;
}

function closeDetail(){
  document.getElementById("dMediaSlot").innerHTML="";
  document.getElementById("detailModal").className="modal";
  currentItem=null;
}

function renderTopicNotes(id){
  var arr=notesStore[id]||[],h="";
  for(var i=0;i<arr.length;i++)h+='<div class="note-item"><div>'+arr[i].text+'</div><div class="sub">'+arr[i].time+'</div></div>';
  document.getElementById("topicNotes").innerHTML=h;
}

function saveNote(){
  if(!currentItem)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  if(!txt)return;
  if(!notesStore[currentItem.id])notesStore[currentItem.id]=[];
  notesStore[currentItem.id].unshift({topicTitle:currentItem.title,text:txt,time:new Date().toLocaleString("zh-CN")});
  saveNotesStore();
  document.getElementById("noteInput").value="";
  renderTopicNotes(currentItem.id);
}

function copyTopicShare(){
  if(!currentItem)return;
  var payload=currentItem.title+"\n出处："+currentItem.src+"\n"+(currentItem.url?("原文："+currentItem.url+"\n\n"):"\n")+(currentItem.fullReport||currentItem.brief);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      document.getElementById("copyTip").innerText="已复制完整报道";
    }).catch(function(){document.getElementById("copyTip").innerText="请手动长按复制"});
  }
}

function runRebuttal(){
  var raw=(document.getElementById("noteInput").value||"").trim();
  var a=raw?("针对你说的「"+raw.slice(0,26)+(raw.length>26?"…":"")+"」"):"针对这篇报道";
  document.getElementById("rp1").innerText="1. 前提核对："+a+"，报道里的关键事实与背景是否完整？有没有遗漏前提？";
  document.getElementById("rp2").innerText="2. 反方立场：如果站在完全相反的立场，最核心的反驳理由是什么？";
  document.getElementById("rp3").innerText="3. 现实代价：顺着这个判断走，可能会忽略哪些代价或副作用？";
  document.getElementById("rebutPanel").style.display="block";
  document.getElementById("detailModal").scrollTop=99999;
}

function switchTab(t){
  document.getElementById("feedView").style.display=t==="feed"?"block":"none";
  document.getElementById("vaultView").style.display=t==="vault"?"block":"none";
  document.getElementById("navFeed").className="nav-btn"+(t==="feed"?" on":"");
  document.getElementById("navVault").className="nav-btn"+(t==="vault"?" on":"");
  if(t==="vault")renderVault();
}

function renderVault(){
  var all=[];
  for(var k in notesStore)if(Object.prototype.hasOwnProperty.call(notesStore,k)){
    var l=notesStore[k]||[];for(var i=0;i<l.length;i++)all.push(l[i]);
  }
  document.getElementById("vaultCount").innerText="已记录 "+all.length+" 条";
  if(!all.length){document.getElementById("vaultList").innerHTML='<div class="panel"><div class="sub">还没有随想笔记，点开任意一条报道写下看法即可保存。</div></div>';return}
  var html="";
  for(var j=0;j<all.length;j++)html+='<div class="panel"><div style="font-size:11px;color:#ff2442;margin-bottom:4px">'+all[j].topicTitle+'</div><div style="font-size:13px">'+all[j].text+'</div><div class="sub">'+all[j].time+'</div></div>';
  document.getElementById("vaultList").innerHTML=html;
}

function clearAllNotes(){notesStore={};saveNotesStore();renderVault()}

refreshAll();
</script>
</body>
</html>
