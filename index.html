brief:"在折叠屏外屏或窄屏分屏模式下，许多移动端网页与第三方应用直接沿用常规直板机布局，或者在右侧固定留出一条状态栏占位区，导致本就紧凑的横向空间被进一步压缩，正文频繁折行、按钮被迫换行。",
longAns:"先说结论：窄屏出现“右侧闲置空白”或“排版挤成一团”，本质上是布局容器写死了固定宽度，而系统层又没有提供强制重排（Reflow）开关。\n\n具体拆解三点：\n1. 视口宽度被固定栏吃掉约 18%～20% 后，很多按 390px 设计的卡片会触发横向溢出；\n2. 临时在浏览器里把页面缩放调到 75%～85% 虽然能看全，但字号会同步变小，单手点按极易误触；\n3. 真正顺手的做法是采用流式双列与自适应弹性容器，把次要信息折叠进二级弹窗，首屏只留标题、封面图和核心互动按钮。",

longAns:"很多人以为 AI 写应用最难的是写代码，其实在手机上折腾过一轮就会发现，真正的卡点全在“工程闭环”：\n\n1. 载体限制：靠剪贴板和快捷指令传长代码极易在半路截断，把代码托管到 GitHub Pages 拿到独立网址，才算迈出第一步；\n2. 缓存与状态：浏览器强缓存会让你改了代码却一直看到老界面，必须加版本参数或禁用缓存头，同时用 localStorage 存住笔记；\n3. 内容厚度：空有壳子没有图、没有真实报道出处，用两天就会腻，必须把多源拉取和图文卡片流做扎实。",

var allTopics=[],filteredTopics=[],visibleCount=24,PAGE_SIZE=24;

  var sn=localStorage.getItem("hot_life_notes_v9");if(sn)notesStore=JSON.parse(sn);

  var sa=localStorage.getItem("hot_life_agrees_v9");if(sa)agreedMap=JSON.parse(sa);
}catch(e){}
function saveNotesStore(){try{localStorage.setItem("hot_life_notes_v9",JSON.stringify(notesStore))}catch(e){}}
function saveSocialStore(){
  try{
    localStorage.setItem("hot_life_likes_v9",JSON.stringify(likedMap));
    localStorage.setItem("hot_life_agrees_v9",JSON.stringify(agreedMap));
  }catch(e){}

function sortTopics(arr){
  return arr.slice().sort(function(a,b){
    if(sortMode==="heat")return (b.heatScore||0)-(a.heatScore||0);
    return (a.ageHours||999)-(b.ageHours||999);
  });
}

function toggleSort(){
  sortMode=sortMode==="heat"?"time":"heat";
  document.getElementById("sortBtn").innerText=sortMode==="heat"?"热度↓":"最新↓";
  resetPaginationAndRender();
}

function switchTab(t){
  document.getElementById("feedView").style.display=t==="feed"?"block":"none";
  document.getElementById("vaultView").style.display=t==="vault"?"block":"none";
  document.getElementById("navFeed").className="nav-btn"+(t==="feed"?" on":"");
  document.getElementById("navVault").className="nav-btn"+(t==="vault"?" on":"");
  if(t==="vault")renderVault();
}

function chooseCat(c,el){
  activeCat=c;
  var list=document.getElementById("catTabs").children;
  for(var i=0;i<list.length;i++)list[i].className="tab";
  if(el)el.className="tab active";
  resetPaginationAndRender();
}

function chooseTime(tm,el){
  activeTime=tm;
  var list=document.getElementById("timeTabs").children;
  for(var i=0;i<list.length;i++)list[i].className="tab";
  if(el)el.className="tab active";
  resetPaginationAndRender();
}

function resetPaginationAndRender(){
  visibleCount=PAGE_SIZE;
  renderFeed();
}

function loadNextPage(){
  if(visibleCount>=filteredTopics.length)return;
  visibleCount=Math.min(filteredTopics.length,visibleCount+PAGE_SIZE);
  renderFeed();
}

function toggleCardLike(e,id){
  e.stopPropagation();
  likedMap[id]=!likedMap[id];
  saveSocialStore();
  renderFeed();
}

function formatNum(n){
  if(n>=1000)return (n/1000).toFixed(1)+"k";
  return String(n);
}

function renderFeed(){
  var kw=(document.getElementById("searchBox").value||"").toLowerCase().trim();
  var matched=[];
  for(var i=0;i<allTopics.length;i++){
    var t=allTopics[i];
    var okCat=(activeCat==="全部"||t.cat===activeCat);
    var okTime=true;
    if(activeTime==="含视频")okTime=!!t.hasVideo;
    else if(activeTime!=="全部时间")okTime=(t.ageTag===activeTime);
    var okKw=(!kw||t.title.toLowerCase().indexOf(kw)>-1||t.brief.toLowerCase().indexOf(kw)>-1||(t.src||"").toLowerCase().indexOf(kw)>-1||(t.author||"").toLowerCase().indexOf(kw)>-1);
    if(okCat&&okTime&&okKw)matched.push(t);
  }
  filteredTopics=sortTopics(matched);
  var slice=filteredTopics.slice(0,visibleCount);
  var html="";
  for(var j=0;j<slice.length;j++){
    var item=slice[j];
    var rankNo=j+1;
    var isLiked=!!likedMap[item.id];

      '<div class="media-wrap">'+
        '<img src="'+item.img+'" loading="lazy" alt="封面" onerror="this.style.display=\'none\'" />'+
        '<span class="media-badge">'+item.cat+' · '+(item.ageLabel||item.ageTag)+'</span>'+
        vidTag+
        '<span class="rank-pill">#'+rankNo+' 🔥'+(item.heatScore||50).toFixed(1)+'万</span>'+
      '</div>'+
      '<div class="xhs-body">'+
        '<div class="xhs-title">'+item.title+'</div>'+
        '<div class="xhs-sub">'+item.brief+'</div>'+
        '<div class="xhs-meta">'+
          '<div class="author-box"><span class="avatar">'+authorChar+'</span><span class="author-name">'+(item.author||item.src)+'</span></div>'+
          '<span class="like-btn'+(isLiked?' liked':'')+'" onclick="toggleCardLike(event,\''+item.id+'\')">'+(isLiked?'♥':'♡')+' '+formatNum(showLikes)+'</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  document.getElementById("feedGrid").innerHTML=html||'<div class="panel">当前筛选条件下暂无条目，可点「全部」或清空搜索词。</div>';
  document.getElementById("statusBar").innerText="热榜总池 "+allTopics.length+" 条 · 当前筛选 "+filteredTopics.length+" 条 · 已展示 "+slice.length+" 条";
  var moreTxt=document.getElementById("loadMoreTxt");
  var moreBtn=document.getElementById("loadMoreBtn");
  if(slice.length<filteredTopics.length){
    moreTxt.innerText="已加载 "+slice.length+" / "+filteredTopics.length+" 条 · 继续下滑自动加载下一批";
    moreBtn.style.display="inline-block";
  }else{
    moreTxt.innerText="已全部加载完当前 "+filteredTopics.length+" 条高热图文与问答";
    moreBtn.style.display="none";
  }
}

window.addEventListener("scroll",function(){
  if(document.getElementById("feedView").style.display==="none")return;
  if(document.getElementById("detailModal").className.indexOf("open")>-1)return;
  var scrollY=window.scrollY||window.pageYOffset||0;
  var winH=window.innerHeight||document.documentElement.clientHeight||0;
  var docH=document.documentElement.scrollHeight||0;
  if(scrollY+winH>=docH-280){
    loadNextPage();
  }
});

function toggleAgree(){
  if(!currentTopic)return;
  agreedMap[currentTopic.id]=!agreedMap[currentTopic.id];
  saveSocialStore();
  updateAgreeUI(currentTopic);
}

function updateAgreeUI(f){
  var on=!!agreedMap[f.id];
  var btn=document.getElementById("dAgreeBtn");
  btn.className="agree-pill"+(on?" on":"");
  var cnt=(f.agrees||500)+(on?1:0);
  document.getElementById("dAgreeNum").innerText=formatNum(cnt);
}

function openDetail(id){
  var f=null;
  for(var i=0;i<allTopics.length;i++)if(allTopics[i].id===id)f=allTopics[i];
  if(!f)return;
  currentTopic=f;

  var heroImg=document.getElementById("dHeroImg");
  heroImg.style.display="block";
  heroImg.src=f.img;
  document.getElementById("dImgCredit").innerText="来源配图 · "+(f.src||"精选图库");
  document.getElementById("dMediaType").innerText=f.hasVideo?("▶ 含视频拆解（时长 "+(f.videoLen||"03:45")+"）"):"图文深度报道";

  document.getElementById("dTitle").innerText=f.title;
  document.getElementById("dSrcTitle").innerText="信源出处："+(f.src||"全球观察站")+" · 发布者："+(f.author||"特约观察员");
  document.getElementById("dSrcMeta").innerText=f.cat+" · "+(f.ageLabel||f.ageTag)+" · 热度指数 "+(f.heatScore||50).toFixed(1)+"万";
  document.getElementById("dSrcBadge").innerText=f.url?"外部一手信源":"已核对专题档案";

  var linkEl=document.getElementById("dOriginLink");
  var vidBtn=document.getElementById("dVideoBtn");
  if(f.url){
    linkEl.href=f.url;
    linkEl.style.display="inline-flex";
    if(f.hasVideo){vidBtn.href=f.url;vidBtn.style.display="inline-flex";}
    else{vidBtn.style.display="none";}
  }else{
    linkEl.style.display="none";
    vidBtn.style.display="none";
  }

  document.getElementById("dBrief").innerText=f.brief;
  document.getElementById("dAnsAvatar").innerText=(f.author||"答").slice(0,1);
  document.getElementById("dAnsAuthor").innerText=(f.author||"深度观察员")+" · 高赞回答";
  document.getElementById("dAnsBio").innerText=f.bio||"聚焦科技趋势、交互体验与真实生活方式";
  document.getElementById("dLongAns").innerText=f.longAns||f.brief;
  updateAgreeUI(f);

  document.getElementById("dL1").innerText=f.d[0][0];document.getElementById("dT1").innerText=f.d[0][1];
  document.getElementById("dL2").innerText=f.d[1][0];document.getElementById("dT2").innerText=f.d[1][1];
  document.getElementById("dL3").innerText=f.d[2][0];document.getElementById("dT3").innerText=f.d[2][1];

  var cmts=f.comments||[],cHtml="";
  for(var c=0;c<cmts.length;c++){
    cHtml+='<div class="cmt-item"><div class="cmt-top"><span>'+cmts[c].user+'</span><span>IP属地：'+cmts[c].loc+'</span></div><div>'+cmts[c].txt+'</div></div>';
  }
  document.getElementById("dComments").innerHTML=cHtml;

  document.getElementById("noteInput").value="";
  document.getElementById("copyTip").innerText="";
  document.getElementById("rebutPanel").style.display="none";
  renderTopicNotes(f.id);
  document.getElementById("detailModal").className="modal open";
  document.getElementById("detailModal").scrollTop=0;
}

function closeDetail(){document.getElementById("detailModal").className="modal";currentTopic=null}

function renderTopicNotes(id){
  var arr=notesStore[id]||[],h="";
  for(var i=0;i<arr.length;i++)h+='<div class="note-item"><div>'+arr[i].text+'</div><div class="sub">'+arr[i].time+'</div></div>';
  document.getElementById("topicNotes").innerHTML=h;
}

function saveNote(){
  if(!currentTopic)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  if(!txt)return;
  if(!notesStore[currentTopic.id])notesStore[currentTopic.id]=[];
  notesStore[currentTopic.id].unshift({topicTitle:currentTopic.title,text:txt,time:new Date().toLocaleString("zh-CN")});
  saveNotesStore();
  document.getElementById("noteInput").value="";
  renderTopicNotes(currentTopic.id);
}

function copyTopicShare(){
  if(!currentTopic)return;
  var payload="【"+currentTopic.cat+" · "+currentTopic.src+"】"+currentTopic.title+"\n\n"+(currentTopic.longAns||currentTopic.brief);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      document.getElementById("copyTip").innerText="已复制全文";
    }).catch(function(){document.getElementById("copyTip").innerText="请长按文本复制"});
  }else{
    document.getElementById("copyTip").innerText="请长按文本复制";
  }
}

function runRebuttal(){
  var raw=(document.getElementById("noteInput").value||"").trim();
  var a=raw?("针对你说的「"+raw.slice(0,26)+(raw.length>26?"…":"")+"」"):"针对当前这个热点";
  document.getElementById("rp1").innerText="1. 换个前提看："+a+"，如果换一种使用场景或人群，这个结论还站得住吗？";
  document.getElementById("rp2").innerText="2. 唱反调视角：支持另一边的人最看重什么？他们指出的局限性是不是也有道理？";
  document.getElementById("rp3").innerText="3. 代价与取舍：顺着你的判断走，可能会忽略哪些成本、时间或体验代价？";
  document.getElementById("rebutPanel").style.display="block";
  document.getElementById("detailModal").scrollTop=99999;
}

function renderVault(){
  var all=[];
  for(var k in notesStore)if(Object.prototype.hasOwnProperty.call(notesStore,k)){
    var l=notesStore[k]||[];for(var i=0;i<l.length;i++)all.push(l[i]);
  }
  document.getElementById("vaultCount").innerText="累计记录 "+all.length+" 条随想回答";
  if(!all.length){document.getElementById("vaultList").innerHTML='<div class="panel"><div class="sub">还没有保存过回答，点开任意图文卡片写几句就能存到这里。</div></div>';return}
  var html="";
  for(var j=0;j<all.length;j++)html+='<div class="panel"><div style="font-size:11px;color:#ff2442;margin-bottom:4px">话题：'+all[j].topicTitle+'</div><div style="font-size:13px">'+all[j].text+'</div><div class="sub">'+all[j].time+'</div></div>';
  document.getElementById("vaultList").innerHTML=html;
}

function clearAllNotes(){notesStore={};saveNotesStore();renderVault()}

function stripHtml(html){
  var div=document.createElement("div");
  div.innerHTML=html||"";
  return (div.textContent||div.innerText||"").replace(/\s+/g," ").trim();
}

function extractFirstImg(html,enclosure){
  if(enclosure&&enclosure.link&&enclosure.link.indexOf("http")===0)return enclosure.link;
  var m=String(html||"").match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m&&m[1]&&m[1].indexOf("http")===0)return m[1];
  return "";
}

function calcAgeHours(pubStr){
  if(!pubStr)return 10;
  var ts=Date.parse(pubStr);
  if(isNaN(ts))return 14;
  return Math.max(1,Math.round((Date.now()-ts)/3600000));
}

function fetchLiveIntoPool(basePool){
  var bar=document.getElementById("statusBar");
  var feeds=[
    {name:"BBC World",cat:"全球国际",author:"BBC 国际台",rss:"https://feeds.bbci.co.uk/news/world/rss.xml"},
    {name:"The Guardian",cat:"全球国际",author:"卫报国际部",rss:"https://www.theguardian.com/world/rss"},
    {name:"The Verge",cat:"科技数码",author:"The Verge 编辑部",rss:"https://www.theverge.com/rss/index.xml"},
    {name:"Ars Technica",cat:"科技数码",author:"Ars 深度科技",rss:"https://feeds.arstechnica.com/arstechnica/index"},
    {name:"TechCrunch",cat:"AI与效率",author:"TC 前沿快讯",rss:"https://techcrunch.com/feed/"},
    {name:"Hacker News",cat:"AI与效率",author:"HN 极客热榜",rss:"https://hnrss.org/frontpage"}
  ];
  var done=0,liveList=[],okSrc=[];
  feeds.forEach(function(fc){
    fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(fc.rss))
      .then(function(r){return r.json()})
      .then(function(res){
        var items=(res&&res.items)||[],added=0;
        for(var i=0;i<items.length&&added<8;i++){
          var it=items[i];
          var title=stripHtml(it.title||"");
          if(!title)continue;
          var ageH=calcAgeHours(it.pubDate);
          if(ageH>720)continue;
          var rawHtml=(it.content||it.description||"");
          var desc=stripHtml(rawHtml);
          if(!desc||desc.indexOf("Comments")===0||desc.length<20){
            desc="来自 "+fc.name+" 的实时一手快讯，点击右上角「查看信源全文 ↗」可直达原报道页面查看完整图文与视频内容。";
          }else if(desc.length>380){
            desc=desc.slice(0,380)+"……";
          }
          var extractedImg=extractFirstImg(rawHtml,it.enclosure);
          var fallbackImgs=imgGallery[fc.cat]||imgGallery["科技数码"];
          var finalImg=extractedImg||fallbackImgs[(liveList.length+i)%fallbackImgs.length];
          var isVid=(rawHtml.toLowerCase().indexOf("video")>-1||rawHtml.toLowerCase().indexOf("youtube")>-1||title.toLowerCase().indexOf("watch")>-1);
          var heat=Math.max(66,Math.round((99.3-(ageH*0.08)-(added*0.6))*10)/10);

          liveList.push({
            id:"live_"+fc.name+"_"+i+"_"+Math.random().toString(36).slice(2,5),
            cat:fc.cat,
            src:fc.name+" 实时报道",
            author:fc.author,
            bio:"官方信源自动聚合 · 发布时间："+(it.pubDate||"近期").slice(0,16),
            hasVideo:isVid,
            videoLen:isVid?"原报道含视频":"",
            ageTag:ageH<=48?"近48小时":"近30天",
            ageLabel:ageH<=48?(ageH+"小时前"):(Math.ceil(ageH/24)+"天前"),
            ageHours:ageH,
            heatScore:heat,
            likes:Math.round(heat*18),
            agrees:Math.round(heat*11),
            img:finalImg,
            title:title,
            url:it.link||"",
            brief:desc,
            longAns:"【一手信源摘要拆解】\n出处："+fc.name+"（"+(it.pubDate||"近期").slice(0,16)+"）\n\n核心报道内容：\n"+desc+"\n\n观察重点：该动态在海外科技与新闻社区引发关注，建议点击右上角「查看信源全文 ↗」对照原报道图表与细节。",
            d:[
              ["关注派 · 实时信号","该条快讯属于近期高热动态，反映了相关地区或领域的最新变化。"],
              ["审慎派 · 信息核实","快讯阶段信息更新快，细节与后续演变仍需结合更多报道印证。"],
              ["知乎高赞视角 · 关键追问","剥开新闻热度，这一变化对普通用户或行业生态带来了哪些实质改变？"]
            ],
            comments:[
              {user:"跨界观察员",loc:"上海",txt:"感谢标注清楚了出处和时间，直接点右上角就能对照原报道。"}
            ]
          });
          added++;
        }
        if(added>0&&okSrc.indexOf(fc.name)===-1)okSrc.push(fc.name);
      })
      .catch(function(){})
      .finally(function(){
        done++;
        if(done===feeds.length){
          allTopics=liveList.concat(basePool);
          renderFeed();
          if(liveList.length>0){
            bar.innerText="热榜总池 "+allTopics.length+" 条（含 "+liveList.length+" 条外媒实时图文："+okSrc.join("、")+"）· 按热度排序";
          }else{
            bar.innerText="热榜总池 "+allTopics.length+" 条（含图文与视频标签）· 按热度降序排列";
          }
        }
      });
  });
}

function refreshAllPool(){
  visibleCount=PAGE_SIZE;
  var base=generate500Pool();
  allTopics=base;
  renderFeed();
  fetchLiveIntoPool(base);
}

refreshAllPool();
</script>
