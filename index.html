<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>全球热点交锋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d1017;color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:12px 12px 86px;line-height:1.55}
.panel{background:#151923;border:1px solid #262d3d;border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#ff2442}
.btn{background:#ff2442;color:#fff;border:none;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn-ghost{background:#1e2433;border:1px solid #333c52;color:#e5e7eb}
.btn-purple{background:#7c3aed}
.btn-blue{background:#2563eb}
.btn-mini{background:#1b2130;border:1px solid #2e374d;color:#d1d5db;border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer}
.sub{font-size:11px;color:#9ca3af;margin-top:6px}
.search{width:100%;background:#0e1118;border:1px solid #262d3d;border-radius:10px;padding:9px 12px;color:#fff;font-size:14px;margin:10px 0;outline:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:999px;font-size:12px;background:#0e1118;color:#9ca3af;border:1px solid #262d3d;cursor:pointer}
.tab.active{background:#f9fafb;color:#0d1017;font-weight:700;border-color:#f9fafb}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:#151923;border:1px solid #262d3d;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.banner{padding:8px 10px;font-size:11px;font-weight:700;color:#fff;display:flex;justify-content:space-between;align-items:center}
.src-badge{background:rgba(0,0,0,.28);padding:1px 6px;border-radius:4px;font-size:10px}
.card-body{padding:11px;display:flex;flex-direction:column;gap:7px;flex:1}
.card-title{font-size:14px;font-weight:700;line-height:1.4}
.card-prev{font-size:12px;color:#9ca3af;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#9ca3af;display:flex;justify-content:space-between}
.modal{display:none;position:fixed;inset:0;background:#0d1017;z-index:100;overflow-y:auto;padding:14px 14px 90px}
.modal.open{display:block}
.sec-hd{font-size:12px;font-weight:700;color:#9ca3af;margin-bottom:6px;letter-spacing:.3px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:6px}
.pro{background:rgba(16,185,129,.18);color:#34d399}
.con{background:rgba(255,36,66,.18);color:#fda4af}
.deep{background:rgba(59,130,246,.18);color:#93c5fd}
.scene-box{background:#10141d;border:1px dashed #2e3850;border-radius:10px;padding:10px 12px;font-size:13px;color:#cbd5e1;margin-bottom:12px}
.chip-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chip{background:#10141d;border:1px solid #252c3d;border-radius:9px;padding:8px 10px;font-size:12px;color:#d1d5db}
textarea{width:100%;min-height:80px;background:#0e1118;border:1px solid #262d3d;border-radius:10px;padding:10px;color:#fff;font-size:13px;margin:8px 0;outline:none}
.pt{background:#161126;border-left:3px solid #a855f7;padding:9px 11px;border-radius:8px;font-size:13px;color:#f3e8ff;margin-top:8px}
.note-item{background:#0e1118;border:1px solid #262d3d;border-radius:10px;padding:10px;margin-top:8px;font-size:12px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,23,.96);border-top:1px solid #262d3d;display:flex;justify-content:space-around;padding:8px 12px 16px;z-index:50}
.nav-btn{background:none;border:none;color:#9ca3af;font-size:12px;font-weight:600;cursor:pointer;padding:4px 14px}
.nav-btn.on{color:#ff6b81}
</style>
</head>
<body>
<div id="feedView">
  <div class="panel">
    <div class="row">
      <div class="brand"><span class="dot"></span>全球热点交锋</div>
      <div class="row" style="gap:6px">
        <button class="btn" onclick="fetchMultiSource()">↻ 多源拉取最新</button>
        <button class="btn btn-ghost" onclick="resetDemo()">精选深度库</button>
      </div>
    </div>
    <div class="sub" id="statusBar">正在加载多源热点库...</div>
    <input class="search" id="searchBox" placeholder="搜索 AI 工具、折叠屏、机器人、创作、生活..." oninput="renderFeed()" />
    <div class="tabs" id="catTabs">
      <span class="tab active" onclick="chooseCat('全部',this)">全部</span>
      <span class="tab" onclick="chooseCat('实时快讯',this)">实时快讯</span>
      <span class="tab" onclick="chooseCat('AI与效率',this)">AI 与效率</span>
      <span class="tab" onclick="chooseCat('数码与交互',this)">数码与交互</span>
      <span class="tab" onclick="chooseCat('内容与生活',this)">内容与生活</span>
    </div>
  </div>
  <div class="grid" id="feedGrid"></div>
</div>

<div id="vaultView" style="display:none">
  <div class="panel">
    <div class="row">
      <div class="brand">我的观点笔记</div>
      <button class="btn-mini" onclick="clearAllNotes()">清空笔记</button>
    </div>
    <div class="sub" id="vaultCount">累计记录 0 条随想与锐评</div>
  </div>
  <div id="vaultList"></div>
</div>

<div class="modal" id="detailModal">
  <div class="row" style="margin-bottom:10px">
    <button class="btn btn-ghost" onclick="closeDetail()">← 返回发现页</button>
    <a id="dOriginLink" class="btn btn-blue" href="#" target="_blank" rel="noopener" style="display:none">阅读原报道 ↗</a>
  </div>
  <div id="dMeta" style="font-size:12px;color:#9ca3af;margin-bottom:6px"></div>
  <h2 id="dTitle" style="font-size:18px;line-height:1.4;margin-bottom:10px"></h2>

  <div class="panel" style="border-left:3px solid #ff2442">
    <div class="sec-hd">报道详情与核心脉络</div>
    <div id="dBrief" style="font-size:13px;color:#e5e7eb;white-space:pre-line"></div>
    <div class="chip-list" id="dPoints"></div>
  </div>

  <div class="scene-box">
    <div class="sec-hd">场景对照与现实影响</div>
    <div id="dScene"></div>
  </div>

  <div class="sec-hd">多视角深度交锋</div>
  <div class="panel"><span class="tag pro" id="dL1"></span><div id="dT1" style="font-size:13px"></div></div>
  <div class="panel"><span class="tag con" id="dL2"></span><div id="dT2" style="font-size:13px"></div></div>
  <div class="panel"><span class="tag deep" id="dL3"></span><div id="dT3" style="font-size:13px"></div></div>

  <div class="panel">
    <div class="sec-hd">写下你的锐评 & 让反方质询</div>
    <textarea id="noteInput" placeholder="输入你的观点或实测体会，点紫色按钮看反方三点质询..."></textarea>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" onclick="saveNote()">保存随想</button>
      <button class="btn btn-purple" onclick="runRebuttal()">⚡ 反方三点质询</button>
      <button class="btn-mini" onclick="copyTopicShare()">复制话题+观点</button>
    </div>
    <div id="copyTip" class="sub"></div>
    <div id="rebutPanel" style="display:none;margin-top:8px">
      <div class="pt" id="rp1"></div>
      <div class="pt" id="rp2"></div>
      <div class="pt" id="rp3"></div>
    </div>
    <div id="topicNotes"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn on" id="navFeed" onclick="switchTab('feed')">热点发现</button>
  <button class="nav-btn" id="navVault" onclick="switchTab('vault')">随想笔记</button>
</div>

var seedTopics=[

scene:"在折叠屏外屏单手刷资讯、查资料或写随想时，冗余边距和未重排布局会显著增加上下滑动次数。",
d:[["赞成派 · 系统级统一规范","固定边距和状态区能防止边缘误触，保证不同尺寸设备下的基础一致性。"],["反对派 · 寸土寸金的浪费","外屏本来就追求单手便携，大块闲置空白既浪费屏幕素质，又拉低了信息密度。"],["知乎高赞视角 · 交互本质","真正优秀的适配不是等比例缩小桌面端，而是根据视口宽度动态折叠次要元素，把主操作区留给内容。"]]},
{id:"t2",cat:"AI与效率",src:"深度选题",heat:"92.1万",bg:"linear-gradient(135deg,#312e81,#6366f1)",
title:"无编程背景用 AI 写应用：从想法到上架之间隔着几道真实门槛？",

bullets:["关键事实 1：单纯依赖本地剪贴板或临时预览容器极易触发文本截断和状态丢失。","关键事实 2：将前端代码托管至云端仓库并配合本地存储（localStorage），是纯移动端突破体积限制的关键一步。","争议焦点：AI 辅助开发究竟是让普通人拥有了独立产品能力，还是制造了更多难以维护的半成品？"],
scene:"用手机浏览器在 GitHub 维护代码并实时预览时，每一次迭代都在验证“AI 出方案 + 人工把关测试”的协作上限。",
d:[["赞成派 · 创造力平权","过去需要团队配合才能验证的产品原型，现在一个人靠对话就能在几天内上线测试。"],["反对派 · 维护与审核门槛高","一旦涉及接口跨域、缓存清理或应用商店原生功能审核，缺乏底层调试经验仍会频繁卡壳。"],["知乎高赞视角 · 抓大放小","用 AI 解决 80% 的模板与界面搭建，把精力集中在核心体验和真实数据源打通上，才是最务实的路径。"]]},
{id:"t3",cat:"AI与效率",src:"深度选题",heat:"88.7万",bg:"linear-gradient(135deg,#065f46,#10b981)",

bullets:["关键事实 1：传统语音助手依赖预设意图匹配，遇到多步跨应用指令或模糊语境极易答非所问。","关键事实 2：具备高动态平衡与灵巧操作能力的硬件本体，正在工厂巡检与特种场景率先跑通闭环。","争议焦点：消费端 AI 硬件应该先做好“看懂屏幕与意图”的软件大脑，还是等机械本体成本降到千元级？"],
scene:"日常使用手机语音助理或桌面机器人时，如果连连续两步的界面操作都要人手动接管，新鲜感几天就会消退。",
d:[["赞成派 · 交互入口仍需语音","解放双手的自然语言交互依然是未来趋势，多模态大模型正在补齐上下文理解短板。"],["反对派 · 拒绝伪智能溢价","没有真实执行力和环境感知能力的“对话盒子”，本质上只是套了外壳的蓝牙音箱。"],["知乎高赞视角 · 实用分水岭","好硬件要么在物理世界帮你干重活，要么在数字世界帮你省点击；卡在中间的玩具最容易吃灰。"]]},
{id:"t4",cat:"内容与生活",src:"深度选题",heat:"85.3万",bg:"linear-gradient(135deg,#7c2d12,#f97316)",
title:"AI 短剧与同质化带货刷屏：为什么越来越多人开始逃离喧嚣信息流？",
brief:"随着自动化生成内容与高频电商带货占据主流短视频信息流，用户刷到的批量复制剧情和情绪诱导内容激增，反向催生了对“无广告、克制、重观点”聚合阅读工具的需求。",
bullets:["关键事实 1：AI 批量生成剧本与换脸配音大幅压低了短剧制作成本，但也导致套路高度雷同。","关键事实 2：算法推荐倾向于放大强情绪与即时转化内容，挤压了深度讨论的生存空间。","争议焦点：内容平台为了商业化牺牲阅读克制，是否正在亲手把高净值用户推向小众聚合工具？"],
scene:"晚上想安静看几条有营养的科技讨论或生活随想，却连续刷到五条生硬带货和夸张短剧时的烦躁感。",
d:[["赞成派 · 效率与娱乐大众化","流水线内容降低了创作门槛，满足了碎片时间的即时消遣和下沉市场需求。"],["反对派 · 信息污染严重","当满屏都是套路和推销，用户寻找真实经验和独立观点的时间成本成倍上升。"],["知乎高赞视角 · 注意力主权","大家反感的不是商业化本身，而是失去筛选权；自己定制信源和笔记库正在成为新刚需。"]]},
{id:"t5",cat:"内容与生活",src:"深度选题",heat:"81.0万",bg:"linear-gradient(135deg,#581c87,#c084fc)",

d:[["赞成派 · 真实体验最稀缺","敢把缺点和适用边界讲透，才能建立长期信任，哪怕体量小也有高粘性粉丝。"],["反对派 · 客观基准不能丢","完全靠主观感受容易陷入情绪化争议，保留标准化对比测试依然有必要。"],["知乎高赞视角 · 坦诚 + 节奏","用 30 秒讲清核心结论，再用真实使用画面和细节支撑观点，是目前最受认可的表达方式。"]]},

var topics=seedTopics.slice(),activeCat="全部",currentTopic=null,notesStore={};
try{var sn=localStorage.getItem("hot_life_notes_v5");if(sn)notesStore=JSON.parse(sn)}catch(e){}
function saveNotesStore(){try{localStorage.setItem("hot_life_notes_v5",JSON.stringify(notesStore))}catch(e){}}

function resetDemo(){
  topics=seedTopics.slice();
  activeCat="全部";
  var list=document.getElementById("catTabs").children;
  for(var i=0;i<list.length;i++)list[i].className=i===0?"tab active":"tab";
  renderFeed();
  document.getElementById("statusBar").innerText="已恢复 "+topics.length+" 条深度精选话题";
}

function switchTab(t){
  document.getElementById("feedView").style.display=t==="feed"?"block":"none";
  document.getElementById("vaultView").style.display=t==="vault"?"block":"none";
  document.getElementById("navFeed").className="nav-btn"+(t==="feed"?" on":"");
  document.getElementById("navVault").className="nav-btn"+(t==="vault"?" on":"");
  if(t==="vault")renderVault();
}

function chooseCat(c,el){
  activeCat=c;
  var list=document.getElementById("catTabs").children;
  for(var i=0;i<list.length;i++)list[i].className="tab";
  if(el)el.className="tab active";
  renderFeed();
}

function renderFeed(){
  var kw=(document.getElementById("searchBox").value||"").toLowerCase().trim(),html="",count=0;
  for(var i=0;i<topics.length;i++){
    var t=topics[i];
    if((activeCat==="全部"||t.cat===activeCat)&&(!kw||t.title.toLowerCase().indexOf(kw)>-1||t.brief.toLowerCase().indexOf(kw)>-1)){
      count++;
      html+='<div class="card" onclick="openDetail(\''+t.id+'\')">'+
        '<div class="banner" style="background:'+t.bg+'"><span>'+t.cat+'</span><span class="src-badge">'+(t.src||"热点")+' · 🔥'+t.heat+'</span></div>'+
        '<div class="card-body">'+
          '<div class="card-title">'+t.title+'</div>'+
          '<div class="card-prev">'+t.brief+'</div>'+
          '<div class="card-foot"><span>'+(t.url?"含原报道摘要":"深度脉络+3方交锋")+'</span><span>展开 →</span></div>'+
        '</div></div>';
    }
  }
  document.getElementById("feedGrid").innerHTML=html||'<div class="panel">没有匹配的话题，换个关键词或点「全部」查看。</div>';
  document.getElementById("statusBar").innerText="当前共 "+count+" / "+topics.length+" 条话题 · 分类："+activeCat;
}

function openDetail(id){
  var f=null;
  for(var i=0;i<topics.length;i++)if(topics[i].id===id)f=topics[i];
  if(!f)return;
  currentTopic=f;
  document.getElementById("dMeta").innerText=(f.src||"热点")+" · "+f.cat+" · 热度 "+f.heat+(f.pubDate?" · "+f.pubDate:"");
  document.getElementById("dTitle").innerText=f.title;
  document.getElementById("dBrief").innerText=f.brief;
  var linkEl=document.getElementById("dOriginLink");
  if(f.url){
    linkEl.href=f.url;
    linkEl.style.display="inline-block";
  }else{
    linkEl.style.display="none";
  }
  var bs=f.bullets||[];
  var bHtml="";
  for(var b=0;b<bs.length;b++)bHtml+='<div class="chip">'+bs[b]+'</div>';
  document.getElementById("dPoints").innerHTML=bHtml;
  document.getElementById("dScene").innerText=f.scene||"结合日常实际使用场景判断该动态的真实影响。";
  document.getElementById("dL1").innerText=f.d[0][0];document.getElementById("dT1").innerText=f.d[0][1];
  document.getElementById("dL2").innerText=f.d[1][0];document.getElementById("dT2").innerText=f.d[1][1];
  document.getElementById("dL3").innerText=f.d[2][0];document.getElementById("dT3").innerText=f.d[2][1];
  document.getElementById("noteInput").value="";
  document.getElementById("copyTip").innerText="";
  document.getElementById("rebutPanel").style.display="none";
  renderTopicNotes(f.id);
  document.getElementById("detailModal").className="modal open";
  document.getElementById("detailModal").scrollTop=0;
}

function closeDetail(){document.getElementById("detailModal").className="modal";currentTopic=null}

function renderTopicNotes(id){
  var arr=notesStore[id]||[],h="";
  for(var i=0;i<arr.length;i++)h+='<div class="note-item"><div>'+arr[i].text+'</div><div class="sub">'+arr[i].time+'</div></div>';
  document.getElementById("topicNotes").innerHTML=h;
}

function saveNote(){
  if(!currentTopic)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  if(!txt)return;
  if(!notesStore[currentTopic.id])notesStore[currentTopic.id]=[];
  notesStore[currentTopic.id].unshift({topicTitle:currentTopic.title,text:txt,time:new Date().toLocaleString("zh-CN")});
  saveNotesStore();
  document.getElementById("noteInput").value="";
  renderTopicNotes(currentTopic.id);
}

function copyTopicShare(){
  if(!currentTopic)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  var payload="【"+currentTopic.cat+"】"+currentTopic.title+"\n摘要："+currentTopic.brief.slice(0,120)+(txt?("\n我的锐评："+txt):"");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      document.getElementById("copyTip").innerText="已复制到剪贴板，可直接粘贴发帖或做素材";
    }).catch(function(){document.getElementById("copyTip").innerText="请长按上方输入框手动复制"});
  }else{
    document.getElementById("copyTip").innerText="当前浏览器不支持一键复制，可手动长按复制";
  }
}

function runRebuttal(){
  var raw=(document.getElementById("noteInput").value||"").trim();
  var a=raw?("针对你说的「"+raw.slice(0,26)+(raw.length>26?"…":"")+"」"):"针对当前这个热点";
  document.getElementById("rp1").innerText="1. 换个前提看："+a+"，如果换一种使用场景或人群，这个结论还站得住吗？";
  document.getElementById("rp2").innerText="2. 唱反调视角：支持另一边的人最看重什么？他们指出的局限性是不是也有道理？";
  document.getElementById("rp3").innerText="3. 代价与取舍：顺着你的判断走，可能会忽略哪些成本、时间或体验代价？";
  document.getElementById("rebutPanel").style.display="block";
  document.getElementById("detailModal").scrollTop=99999;
}

function renderVault(){
  var all=[];
  for(var k in notesStore)if(Object.prototype.hasOwnProperty.call(notesStore,k)){
    var l=notesStore[k]||[];for(var i=0;i<l.length;i++)all.push(l[i]);
  }
  document.getElementById("vaultCount").innerText="累计记录 "+all.length+" 条随想笔记";
  if(!all.length){document.getElementById("vaultList").innerHTML='<div class="panel"><div class="sub">还没有保存过随想，点开任意话题写几句就能存到这里。</div></div>';return}
  var html="";
  for(var j=0;j<all.length;j++)html+='<div class="panel"><div style="font-size:11px;color:#ff6b81;margin-bottom:4px">话题：'+all[j].topicTitle+'</div><div style="font-size:13px">'+all[j].text+'</div><div class="sub">'+all[j].time+'</div></div>';
  document.getElementById("vaultList").innerHTML=html;
}

function clearAllNotes(){notesStore={};saveNotesStore();renderVault()}

function stripHtml(html){
  var div=document.createElement("div");
  div.innerHTML=html||"";
  var txt=(div.textContent||div.innerText||"").replace(/\s+/g," ").trim();
  return txt;
}

function isStaleTitle(t){
  var s=String(t||"").toLowerCase();
  if(s.indexOf("2020")>-1||s.indexOf("2021")>-1||s.indexOf("2022")>-1||s.indexOf("2023")>-1||s.indexOf("2024")>-1||s.indexOf("2025")>-1)return true;
  if(s.indexOf("top 10 ")>-1||s.indexOf("best ai tools")>-1)return true;
  return false;
}

function fetchMultiSource(){
  var bar=document.getElementById("statusBar");
  bar.innerText="正在并发拉取 3 路全球科技与热点源...";
  var sources=[
    {name:"The Verge",url:"https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.theverge.com%2Frss%2Findex.xml"},
    {name:"Ars Technica",url:"https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Ffeeds.arstechnica.com%2Farstechnica%2Findex"},
    {name:"Hacker News",url:"https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fhnrss.org%2Ffrontpage"}
  ];
  var bgs=["linear-gradient(135deg,#831843,#ec4899)","linear-gradient(135deg,#312e81,#6366f1)","linear-gradient(135deg,#7c2d12,#f97316)","linear-gradient(135deg,#065f46,#10b981)","linear-gradient(135deg,#1e3a8a,#38bdf8)"];
  var doneCount=0,collected=[];

  sources.forEach(function(src,sIdx){
    fetch(src.url).then(function(r){return r.json()}).then(function(res){
      var items=(res&&res.items)||[];
      for(var i=0;i<items.length&&i<6;i++){
        var it=items[i];
        var title=(it.title||"").trim();
        if(!title||isStaleTitle(title))continue;
        var cleanDesc=stripHtml(it.description||it.content||"");
        if(cleanDesc.indexOf("Comments")===0||cleanDesc.length<25){
          cleanDesc="该条热议来自 "+src.name+" 实时榜单，点击上方「阅读原报道 ↗」可直达查看完整报道全文与细节参数。";
        }else if(cleanDesc.length>360){
          cleanDesc=cleanDesc.slice(0,360)+"……";
        }
        var pub=(it.pubDate||"").slice(0,16);
        var idx=collected.length;
        collected.push({
          id:"live_"+sIdx+"_"+i,
          cat:"实时快讯",
          src:src.name,
          heat:(96-(idx%15)*2)+".5万",
          bg:bgs[idx%bgs.length],
          title:title,
          url:it.link||"",
          pubDate:pub,
          brief:cleanDesc,
          bullets:[
            "信源出处："+src.name+(pub?("（发布时间："+pub+"）"):""),
            "报道看点："+cleanDesc.slice(0,75)+(cleanDesc.length>75?"…":""),
            "阅读提示：点击右上角蓝色按钮「阅读原报道 ↗」可查看完整图文报道。"
          ],
          scene:"关注全球科技与数码动态时，结合一手报道摘要与多方讨论，能更快判断新产品或新技术是否值得跟进。",
          d:[
            ["关注派 · 趋势价值","该动态反映了当前海外科技与创作者社区的最新关注焦点，值得跟踪后续落地。"],
            ["审慎派 · 冷静观察","早期新闻报道往往侧重亮点展示，实际体验与普及速度仍需时间验证。"],
            ["知乎高赞视角 · 关键追问","剥开新闻标题的热度，它究竟解决了哪类用户的真实痛点？"]
          ]
        });
      }
    }).catch(function(){}).finally(function(){
      doneCount++;
      if(doneCount===sources.length){
        if(collected.length>0){
          topics=collected.concat(seedTopics);
          renderFeed();
          bar.innerText="刷新成功！已聚合 "+collected.length+" 条最新全球报道 + "+seedTopics.length+" 条深度专题";
        }else{
          bar.innerText="当前网络未能连上海外 RSS 接口，已保留 "+seedTopics.length+" 条深度精选专题";
        }
      }
    });
  });
}

renderFeed();
fetchMultiSource();
</script>
</body>
</html>
