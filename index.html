    {cat:"科技数码",topics:["超薄折叠屏铰链寿命与外屏交互生态演进","端侧大模型本地运行对手机内存与功耗的考验","高刷新率护眼屏幕调光方案实测对比","便携式多口氮化镓快充与桌面理线新思路","微型投影与头显设备能否替代卧室第二块屏","无线麦克风降噪算法与户外收音实测表现","开源掌机与轻量化移动办公外设组合体验","卫星通信与弱网环境下离线工具的实用边界"]},
    {cat:"AI与效率",topics:["多模态模型看懂手机屏幕后的自动化工作流","AI 辅助剪辑、字幕校对与人声优化流水线实践","个人知识库检索与碎片笔记自动归档技巧","对话式编程在原型验证与界面重构中的边界","AI 搜索摘要如何减少广告干扰与信息噪音","本地轻量模型与云端大模型分工协作策略","自动化信息聚合与多源 RSS 过滤降噪方案","AI 生成演示文稿与结构化长文的审校要点"]},
    {cat:"内容生活",topics:["去算法化的个人订阅阅读与信息断舍离实践","长图文深度拆解为何重新赢回高粘性读者","极简桌面搭建与夜间低蓝光阅读环境布置","独立创作者如何平衡内容真诚度与商业合作","播客与长音频在通勤和睡前场景的陪伴价值","城市步行友好街区与小众独立书店探访实录","高效睡眠管理与减少睡前无效刷屏的实用方法","断舍离后留下的高使用率随身好物清单"]}
  ];
  var pool=[];
  for(var c=0;c<coreTopics.length;c++){
    var ct=coreTopics[c];
    pool.push({
      id:"core_"+c,
      cat:ct.cat,
      src:ct.src,
      ageTag:ct.ageTag,
      ageHours:ct.ageHours,
      heatScore:ct.heatScore,
      bg:bgs[c%bgs.length],
      title:ct.title,
      url:"",
      brief:ct.brief,
      bullets:ct.bullets,
      scene:ct.scene,
      d:ct.d
    });
  }
  var idx=0;
  while(pool.length<520){
    var reg=regions[idx%regions.length];
    var dom=domains[idx%domains.length];
    var subTopic=dom.topics[Math.floor(idx/domains.length)%dom.topics.length];
    var round=Math.floor(idx/(regions.length*domains.length))+1;
    var isRecent=(idx%3!==0);
    var hours=isRecent?(2+(idx%44)):(72+(idx%600));
    var ageLabel=hours<=48?"近48小时":("近"+Math.max(3,Math.round(hours/24))+"天");
    var rawHeat=94.5-(idx*0.105)+(isRecent?1.8:0);
    var heatScore=Math.max(38.1,Math.round(rawHeat*10)/10);
    var suffix=round>1?("（第"+round+"期追踪）"):"";
    pool.push({
      id:"pool_"+idx,
      cat:dom.cat,
      src:reg+"观察",
      ageTag:hours<=48?"近48小时":"近30天",
      ageLabel:ageLabel,
      ageHours:hours,
      heatScore:heatScore,
      bg:bgs[(idx+2)%bgs.length],
      title:"【"+reg+"】"+subTopic+suffix,
      url:"",
      brief:"聚焦"+reg+"近期围绕「"+subTopic+"」的一线动态与用户反馈。过去"+(hours<=48?"48小时内":"一个月内")+"，当地创作者、开发者与普通用户在体验细节、实际成本与长期实用性上展开了高频讨论。",
      bullets:[
        "地区与时效："+reg+" · "+ageLabel+"高热议题（热度指数 "+heatScore.toFixed(1)+"万）。",
        "核心观察：围绕「"+subTopic+"」，一线用户最看重实际落地流畅度与无隐性门槛。",
        "延伸对比：不同地区在网络环境、硬件偏好与内容消费习惯上的差异正在显现。"
      ],
      scene:"对照"+reg+"的最新动态与自身日常使用习惯，判断该趋势是否值得投入时间跟进。",
      d:[
        ["支持派 · 体验升级明显","一线反馈显示，新方案在效率与顺手度上确实解决了老痛点，值得尽早尝试。"],
        ["观望派 · 仍有磨合成本","实际使用中依然存在学习门槛或生态兼容细节，建议等成熟后再主力切换。"],
        ["知乎高赞视角 · 抓核心价值","不被单一地区的热度带节奏，看清它能否在你的日常高频场景里真正省时间。"]
      ]
    });
    idx++;
  }
  return pool;
}

var allTopics=[],filteredTopics=[],visibleCount=24,PAGE_SIZE=24;
var activeCat="全部",activeTime="全部时间",sortMode="heat",currentTopic=null,notesStore={};
try{var sn=localStorage.getItem("hot_life_notes_v8");if(sn)notesStore=JSON.parse(sn)}catch(e){}
function saveNotesStore(){try{localStorage.setItem("hot_life_notes_v8",JSON.stringify(notesStore))}catch(e){}}

function sortTopics(arr){
  return arr.slice().sort(function(a,b){
    if(sortMode==="heat")return (b.heatScore||0)-(a.heatScore||0);
    return (a.ageHours||999)-(b.ageHours||999);
  });
}

function toggleSort(){
  sortMode=sortMode==="heat"?"time":"heat";
  document.getElementById("sortBtn").innerText=sortMode==="heat"?"排序：热度↓":"排序：最新↓";
  resetPaginationAndRender();
}

function switchTab(t){
  document.getElementById("feedView").style.display=t==="feed"?"block":"none";
  document.getElementById("vaultView").style.display=t==="vault"?"block":"none";
  document.getElementById("navFeed").className="nav-btn"+(t==="feed"?" on":"");
  document.getElementById("navVault").className="nav-btn"+(t==="vault"?" on":"");
  if(t==="vault")renderVault();
}

function chooseCat(c,el){
  activeCat=c;
  var list=document.getElementById("catTabs").children;
  for(var i=0;i<list.length;i++)list[i].className="tab";
  if(el)el.className="tab active";
  resetPaginationAndRender();
}

function chooseTime(tm,el){
  activeTime=tm;
  var list=document.getElementById("timeTabs").children;
  for(var i=0;i<list.length;i++)list[i].className="tab";
  if(el)el.className="tab active";
  resetPaginationAndRender();
}

function resetPaginationAndRender(){
  visibleCount=PAGE_SIZE;
  renderFeed();
}

function loadNextPage(){
  if(visibleCount>=filteredTopics.length)return;
  visibleCount=Math.min(filteredTopics.length,visibleCount+PAGE_SIZE);
  renderFeed();
}

function renderFeed(){
  var kw=(document.getElementById("searchBox").value||"").toLowerCase().trim();
  var matched=[];
  for(var i=0;i<allTopics.length;i++){
    var t=allTopics[i];
    var okCat=(activeCat==="全部"||t.cat===activeCat);
    var okTime=(activeTime==="全部时间"||t.ageTag===activeTime);
    var okKw=(!kw||t.title.toLowerCase().indexOf(kw)>-1||t.brief.toLowerCase().indexOf(kw)>-1||(t.src||"").toLowerCase().indexOf(kw)>-1);
    if(okCat&&okTime&&okKw)matched.push(t);
  }
  filteredTopics=sortTopics(matched);
  var slice=filteredTopics.slice(0,visibleCount);
  var html="";
  for(var j=0;j<slice.length;j++){
    var item=slice[j];
    var rankNo=j+1;
    var freshBadge=item.ageLabel||item.ageTag||"近期";
    html+='<div class="card" onclick="openDetail(\''+item.id+'\')">'+
      '<div class="banner" style="background:'+item.bg+'"><span class="rank-num">#'+rankNo+' · '+item.cat+'</span><span>🔥'+(item.heatScore||50).toFixed(1)+'万</span></div>'+
      '<div class="card-body">'+
        '<div class="card-title">'+item.title+'</div>'+
        '<div class="card-prev">'+item.brief+'</div>'+
        '<div class="card-foot"><span>'+(item.src||"全球观察")+'</span><span class="fresh-tag">'+freshBadge+'</span></div>'+
      '</div></div>';
  }
  document.getElementById("feedGrid").innerHTML=html||'<div class="panel">当前筛选条件下暂无条目，可切换「全部」或清空搜索词。</div>';
  document.getElementById("statusBar").innerText="热榜总池 "+allTopics.length+" 条 · 当前筛选 "+filteredTopics.length+" 条 · 已展示 "+slice.length+" 条";
  var moreTxt=document.getElementById("loadMoreTxt");
  var moreBtn=document.getElementById("loadMoreBtn");
  if(slice.length<filteredTopics.length){
    moreTxt.innerText="已加载 "+slice.length+" / "+filteredTopics.length+" 条 · 继续下滑自动加载下一批";
    moreBtn.style.display="inline-block";
  }else{
    moreTxt.innerText="已全部加载完当前 "+filteredTopics.length+" 条高热话题";
    moreBtn.style.display="none";
  }
}

window.addEventListener("scroll",function(){
  if(document.getElementById("feedView").style.display==="none")return;
  if(document.getElementById("detailModal").className.indexOf("open")>-1)return;
  var scrollY=window.scrollY||window.pageYOffset||0;
  var winH=window.innerHeight||document.documentElement.clientHeight||0;
  var docH=document.documentElement.scrollHeight||0;
  if(scrollY+winH>=docH-260){
    loadNextPage();
  }
});

function openDetail(id){
  var f=null;
  for(var i=0;i<allTopics.length;i++)if(allTopics[i].id===id)f=allTopics[i];
  if(!f)return;
  currentTopic=f;
  document.getElementById("dMeta").innerText=(f.src||"热点")+" · "+f.cat+" · "+(f.ageLabel||f.ageTag)+" · 热度 "+(f.heatScore||50).toFixed(1)+"万";
  document.getElementById("dTitle").innerText=f.title;
  document.getElementById("dBrief").innerText=f.brief;
  var linkEl=document.getElementById("dOriginLink");
  if(f.url){linkEl.href=f.url;linkEl.style.display="inline-block";}
  else{linkEl.style.display="none";}
  var bs=f.bullets||[],bHtml="";
  for(var b=0;b<bs.length;b++)bHtml+='<div class="chip">'+bs[b]+'</div>';
  document.getElementById("dPoints").innerHTML=bHtml;
  document.getElementById("dScene").innerText=f.scene||"结合日常实际使用场景判断该动态的真实影响。";
  document.getElementById("dL1").innerText=f.d[0][0];document.getElementById("dT1").innerText=f.d[0][1];
  document.getElementById("dL2").innerText=f.d[1][0];document.getElementById("dT2").innerText=f.d[1][1];
  document.getElementById("dL3").innerText=f.d[2][0];document.getElementById("dT3").innerText=f.d[2][1];
  document.getElementById("noteInput").value="";
  document.getElementById("copyTip").innerText="";
  document.getElementById("rebutPanel").style.display="none";
  renderTopicNotes(f.id);
  document.getElementById("detailModal").className="modal open";
  document.getElementById("detailModal").scrollTop=0;
}

function closeDetail(){document.getElementById("detailModal").className="modal";currentTopic=null}

function renderTopicNotes(id){
  var arr=notesStore[id]||[],h="";
  for(var i=0;i<arr.length;i++)h+='<div class="note-item"><div>'+arr[i].text+'</div><div class="sub">'+arr[i].time+'</div></div>';
  document.getElementById("topicNotes").innerHTML=h;
}

function saveNote(){
  if(!currentTopic)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  if(!txt)return;
  if(!notesStore[currentTopic.id])notesStore[currentTopic.id]=[];
  notesStore[currentTopic.id].unshift({topicTitle:currentTopic.title,text:txt,time:new Date().toLocaleString("zh-CN")});
  saveNotesStore();
  document.getElementById("noteInput").value="";
  renderTopicNotes(currentTopic.id);
}

function copyTopicShare(){
  if(!currentTopic)return;
  var txt=(document.getElementById("noteInput").value||"").trim();
  var payload="【"+currentTopic.cat+"】"+currentTopic.title+"\n摘要："+currentTopic.brief.slice(0,120)+(txt?("\n我的锐评："+txt):"");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(function(){
      document.getElementById("copyTip").innerText="已复制到剪贴板，可直接粘贴发帖或做素材";
    }).catch(function(){document.getElementById("copyTip").innerText="请长按上方输入框手动复制"});
  }else{
    document.getElementById("copyTip").innerText="当前浏览器不支持一键复制，可手动长按复制";
  }
}

function runRebuttal(){
  var raw=(document.getElementById("noteInput").value||"").trim();
  var a=raw?("针对你说的「"+raw.slice(0,26)+(raw.length>26?"…":"")+"」"):"针对当前这个热点";
  document.getElementById("rp1").innerText="1. 换个前提看："+a+"，如果换一种使用场景或人群，这个结论还站得住吗？";
  document.getElementById("rp2").innerText="2. 唱反调视角：支持另一边的人最看重什么？他们指出的局限性是不是也有道理？";
  document.getElementById("rp3").innerText="3. 代价与取舍：顺着你的判断走，可能会忽略哪些成本、时间或体验代价？";
  document.getElementById("rebutPanel").style.display="block";
  document.getElementById("detailModal").scrollTop=99999;
}

function renderVault(){
  var all=[];
  for(var k in notesStore)if(Object.prototype.hasOwnProperty.call(notesStore,k)){
    var l=notesStore[k]||[];for(var i=0;i<l.length;i++)all.push(l[i]);
  }
  document.getElementById("vaultCount").innerText="累计记录 "+all.length+" 条随想笔记";
  if(!all.length){document.getElementById("vaultList").innerHTML='<div class="panel"><div class="sub">还没有保存过随想，点开任意话题写几句就能存到这里。</div></div>';return}
  var html="";
  for(var j=0;j<all.length;j++)html+='<div class="panel"><div style="font-size:11px;color:#ff6b81;margin-bottom:4px">话题：'+all[j].topicTitle+'</div><div style="font-size:13px">'+all[j].text+'</div><div class="sub">'+all[j].time+'</div></div>';
  document.getElementById("vaultList").innerHTML=html;
}

function clearAllNotes(){notesStore={};saveNotesStore();renderVault()}

function stripHtml(html){
  var div=document.createElement("div");
  div.innerHTML=html||"";
  return (div.textContent||div.innerText||"").replace(/\s+/g," ").trim();
}

function calcAgeHours(pubStr){
  if(!pubStr)return 12;
  var ts=Date.parse(pubStr);
  if(isNaN(ts))return 16;
  var diffH=Math.max(1,Math.round((Date.now()-ts)/3600000));
  return diffH;
}

function fetchLiveIntoPool(basePool){
  var bar=document.getElementById("statusBar");
  var feeds=[
    {name:"BBC World",cat:"全球国际",rss:"https://feeds.bbci.co.uk/news/world/rss.xml"},
    {name:"The Guardian",cat:"全球国际",rss:"https://www.theguardian.com/world/rss"},
    {name:"NPR World",cat:"全球国际",rss:"https://feeds.npr.org/1004/rss.xml"},
    {name:"The Verge",cat:"科技数码",rss:"https://www.theverge.com/rss/index.xml"},
    {name:"Ars Technica",cat:"科技数码",rss:"https://feeds.arstechnica.com/arstechnica/index"},
    {name:"TechCrunch",cat:"AI与效率",rss:"https://techcrunch.com/feed/"},
    {name:"Hacker News",cat:"AI与效率",rss:"https://hnrss.org/frontpage"}
  ];
  var done=0,liveList=[],okSrc=[];
  feeds.forEach(function(fc){
    fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(fc.rss))
      .then(function(r){return r.json()})
      .then(function(res){
        var items=(res&&res.items)||[],added=0;
        for(var i=0;i<items.length&&added<8;i++){
          var it=items[i];
          var title=stripHtml(it.title||"");
          if(!title)continue;
          var ageH=calcAgeHours(it.pubDate);
          if(ageH>720)continue;
          var desc=stripHtml(it.description||it.content||"");
          if(!desc||desc.indexOf("Comments")===0||desc.length<20){
            desc="来自 "+fc.name+" 的近期实时快讯，点击上方蓝色「查看原报道 ↗」可直达查看完整报道全文。";
          }else if(desc.length>360){
            desc=desc.slice(0,360)+"……";
          }
          var heat=Math.max(65,Math.round((99.2-(ageH*0.08)-(added*0.7))*10)/10);
          liveList.push({
            id:"live_"+fc.name+"_"+i+"_"+Math.random().toString(36).slice(2,5),
            cat:fc.cat,
            src:fc.name,
            ageTag:ageH<=48?"近48小时":"近30天",
            ageLabel:ageH<=48?(ageH+"小时前"):(Math.ceil(ageH/24)+"天前"),
            ageHours:ageH,
            heatScore:heat,
            bg:bgs[liveList.length%bgs.length],
            title:title,
            url:it.link||"",
            brief:desc,
            bullets:[
              "信源与时效："+fc.name+" · "+(ageH<=48?(ageH+"小时前发布"):(Math.ceil(ageH/24)+"天前发布")),
              "报道核心："+desc.slice(0,80)+(desc.length>80?"…":""),
              "原文入口：点击详情页右上角「查看原报道 ↗」可阅读原站完整报道。"
            ],
            scene:"结合实时国际与科技动态判断趋势变化，并与近30天同类话题对照参考。",
            d:[
              ["关注派 · 实时信号","该条动态属于近期高热议题，反映了相关领域或地区的最新变化。"],
              ["审慎派 · 持续观察","单一报道侧重阶段性进展，长期影响仍需结合后续多方报道印证。"],
              ["知乎高赞视角 · 关键追问","剥开新闻热度，这一变化对普通用户或行业生态带来了哪些实质改变？"]
            ]
          });
          added++;
        }
        if(added>0&&okSrc.indexOf(fc.name)===-1)okSrc.push(fc.name);
      })
      .catch(function(){})
      .finally(function(){
        done++;
        if(done===feeds.length){
          allTopics=liveList.concat(basePool);
          renderFeed();
          if(liveList.length>0){
            bar.innerText="热榜总池 "+allTopics.length+" 条（含 "+liveList.length+" 条实时外媒快讯："+okSrc.join("、")+"）· 按热度排序";
          }else{
            bar.innerText="热榜总池 "+allTopics.length+" 条（近1-2天及近30天高热库）· 当前网络未直连外媒接口";
          }
        }
      });
  });
}

function refreshAllPool(){
  visibleCount=PAGE_SIZE;
  var base=generate500Pool();
  allTopics=base;
  renderFeed();
  fetchLiveIntoPool(base);
}

refreshAllPool();
</script>
